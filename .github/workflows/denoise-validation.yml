name: NAFNet checkpoint validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-checkpoint:
    name: Required NAFNet reference and workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prefetch exact author checkpoint and pinned reference implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nafnet"
          curl --fail --location --retry 3 'https://drive.usercontent.google.com/download?id=1lsByk21Xw-6aW7epCwOQxvm6HYCQZPHZ&export=download&confirm=t' -o "$RUNNER_TEMP/nafnet/original.pth"
          echo "89c70e808d1783b6c07911306e106aaf0d4f7f3da8c61078b99ff7f8929a26f4  $RUNNER_TEMP/nafnet/original.pth" | sha256sum -c -
          base=https://raw.githubusercontent.com/megvii-research/NAFNet/2b4af71ebe098a92a75910c233a3965a3e93ede4/basicsr/models/archs
          curl --fail --location "$base/NAFNet_arch.py" -o "$RUNNER_TEMP/nafnet/network.py"
          curl --fail --location "$base/arch_util.py" -o "$RUNNER_TEMP/nafnet/util.py"
      - name: Generate independent PyTorch references and deterministic F32 bundle
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3 safetensors==0.8.0
          python tools/nafnet_reference.py "$RUNNER_TEMP/nafnet/original.pth" "$RUNNER_TEMP/nafnet/network.py" "$RUNNER_TEMP/nafnet/util.py" "$RUNNER_TEMP/nafnet/bundle"
          echo "c6ae62717e6a8388e376302a592ada0d84333836fef32c25c25a130d72d6159a  $RUNNER_TEMP/nafnet/bundle/nafnet-sidd-width32-v1.safetensors" | sha256sum -c -
      - name: Validate public model, engine/export and headless UI boundaries
        env:
          LIGHTCRAFT_NAFNET_REFERENCE: ${{ runner.temp }}/nafnet/bundle
          LIGHTCRAFT_GPU: '0'
        run: |
          /usr/bin/time -v cargo test -p lightcraft-engine --features reference-validation --test denoise -- --nocapture
          /usr/bin/time -v cargo test -p lightcraft-ui-egui --features reference-validation tests_denoise --lib -- --nocapture
      - name: Compare real checkpoint inference with independent reference
        env:
          LIGHTCRAFT_NAFNET_REFERENCE: ${{ runner.temp }}/nafnet/bundle
        run: /usr/bin/time -v cargo test -p lightcraft-nafnet --features reference-validation -- --nocapture
